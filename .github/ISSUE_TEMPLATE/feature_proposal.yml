name: Feature Proposal
description: Propose a change, improvement, or extension adhering to the project roadmap
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Feature proposals must align with the vision documented in the README.
        To avoid scope creep, **all proposals must reference the corresponding section of `README.md` or a formal Architecture Decision Record (ADR)**.
  - type: input
    id: readme_section
    attributes:
      label: README Section Reference
      description: Exact section in README.md or docs/adr/ that this proposal relates to (e.g., "16. Fiat on-ramps and off-ramps", "20. Roadmap Phase 2: Pilot").
      placeholder: "e.g., Section 20 - Phase 2 Pilot / ADR 0003"
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: What user problem, regulatory requirement, or architectural gap does this proposal address?
    validations:
      required: true
  - type: textarea
    id: proposed_solution
    attributes:
      label: Proposed Solution
      description: Detailed design of how this feature should work.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: What other approaches did you evaluate and why were they rejected?
  - type: checkboxes
    id: anti_drift
    attributes:
      label: Anti-Drift and Privacy Compliance
      options:
        - label: This proposal preserves zero-PII ledger guarantees (no student names, IDs, or raw data on-chain).
          required: true
        - label: This proposal maintains platform non-custody and fail-closed voucher semantics.
          required: true
        - label: I verified this proposal fits within the current or planned phase in README.md.
          required: true
