name: Bug Report
description: Create a report to help us reproduce and fix an issue
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a bug. Please ensure no sensitive keys, private student records, or production secrets are pasted into this report.
        For security vulnerabilities, please refer to [SECURITY.md](../../SECURITY.md) instead of creating a public issue.
  - type: input
    id: component
    attributes:
      label: Affected Component
      description: Which part of the system is failing?
      placeholder: "e.g., contracts, apps/api, apps/attester, apps/indexer, apps/web"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: How can maintainers reproduce the issue?
      placeholder: |
        1. Run 'pnpm dev'
        2. Execute transaction...
        3. Observe error...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs or Error Output
      description: Paste relevant logs or stack traces.
      render: shell
  - type: checkboxes
    id: terms
    attributes:
      label: Verification
      options:
        - label: I confirmed this report does not contain sensitive personal student data or private keys.
          required: true
        - label: I checked existing issues to avoid filing a duplicate.
          required: true
