name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── Rust: contract ────────────────────────────────────────────────────────
  rust-checks:
    name: Rust Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Add wasm target
        run: rustup target add wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --check
      - name: Run clippy
        run: cargo clippy -- -D warnings
      - name: Run contract unit tests
        run: cargo test
      - name: Build WASM
        run: cargo build --target wasm32-unknown-unknown --release

  # ── Node.js: all TypeScript packages and apps ─────────────────────────────
  node-checks:
    name: Node.js Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 8.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Lint all packages
      - name: Lint
        run: pnpm lint

      # Build shared packages first (bindings depend on them)
      - name: Build shared packages
        run: pnpm --filter @tuition-escrow/shared build

      # Test each app/package
      - name: Test — shared
        run: pnpm --filter @tuition-escrow/shared test

      - name: Test — api
        run: pnpm --filter @tuition-escrow/api test

      - name: Test — indexer
        run: pnpm --filter @tuition-escrow/indexer test

      - name: Test — attester
        run: pnpm --filter @tuition-escrow/attester test

      - name: Test — web (unit + component)
        run: pnpm --filter @tuition-escrow/web test

      # Build everything to catch type errors
      - name: Build all
        run: pnpm build

  # ── Security audits ───────────────────────────────────────────────────────
  security:
    name: Security Audit
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Rust audit
        uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
      - uses: pnpm/action-setup@v3
        with:
          version: 8.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: pnpm audit
        run: pnpm audit --audit-level moderate || true
