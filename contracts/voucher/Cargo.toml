[package]
name = "voucher"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[dependencies]
soroban-sdk = { version = "22.0.0" }

[dev-dependencies]
soroban-sdk = { version = "22.0.0", features = ["testutils"] }
# proptest is incompatible with soroban-env-host's rand 0.8 dependency tree.
# Property tests are implemented as exhaustive parameterized loops in test.rs.
